# Fly.io single-container deployment (frontend + FastAPI/WS in one image).
#
# `fly deploy` builds the Dockerfile and rolls machines out in primary_region.
# Note: deploy does NOT move existing machines between regions — to relocate,
# `fly machines clone <id> --region <region>` then destroy the old machine.
# The app name must be globally unique on Fly — change `app` below if taken.
#
# Cost note: shared-cpu-1x + 1024MB runs ~$4-8/mo (torch CPU + yolov8n-class
# weights want ~700MB resident). For a stub-detector demo, drop memory to 256.

app = 'parking-bay-detection'
primary_region = 'syd' # Sydney — closest Fly region to Perth (no 'per'; 'sin' is the alternative)

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 40
    hard_limit = 60

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
