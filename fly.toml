# Fly.io single-container deployment (frontend + FastAPI/WS in one image).
#
# `fly deploy` builds the Dockerfile and rolls machines out in primary_region.
# Note: deploy does NOT move existing machines between regions — to relocate,
# `fly machines clone <id> --region <region>` then destroy the old machine.
# The app name must be globally unique on Fly — change `app` below if taken.
#
# Cost note: performance-1x + 2048MB runs ~$13-16/mo. This matters: inference
# measured ~80ms on a multithreaded laptop CPU (imgsz 960) but seconds on a
# shared-cpu-1x vCPU — the shared/burstable quota is the source of the 2-5s
# latency spikes. For a stub-detector demo, drop to shared-cpu-1x + 256MB.

app = 'parking-bay-detection'
primary_region = 'syd' # Sydney — closest Fly region to Perth (no 'per'; 'sin' is the alternative)

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 40
    hard_limit = 60

[[vm]]
  # Dedicated (not shared/burstable) vCPU: torch inference is the bottleneck,
  # and shared-cpu quota exhaustion shows up as multi-second latencyMs spikes.
  size = 'performance-1x'
  memory = '2048mb'

[env]
  # One torch thread: the machine has exactly 1 vCPU, and torch would
  # otherwise spawn one worker thread per host core and thrash the quota.
  PARKING_TORCH_THREADS = '1'
