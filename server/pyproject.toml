[project]
name = "parking-bay-server"
version = "0.1.0"
description = "FastAPI + YOLO detection service for the parking-bay simulation"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Real inference (M4). Kept out of the base install so tests never need
# ultralytics, torch, or the YOLO weights.
model = [
    "ultralytics>=8.3",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ensure the repo's tests package wins over ultralytics-platform's stray
# site-packages `tests` package (regular package beats namespace package).
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
